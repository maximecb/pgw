<text x="40.0" y="270.0" font-family="'DejaVu Sans Mono','Lucida Console',Menlo,Consolas,monospace" font-size="11.5" fill="#444" text-anchor="start">The sender writes into the receiver's buffer, reading out of a heap that has to stay live</text>
